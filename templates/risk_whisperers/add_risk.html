<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Risk - RiskSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
    <!-- PYTHON: @admin_required
         GET: assets, treatment_options, annex_controls, risk_statuses
         Optional query asset_id to pre-select asset dropdown
         POST: INSERT risk; risk_rating = likelihood * impact; link annex controls in junction table
         audit_log CREATE; redirect risks list -->
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid"><a class="navbar-brand" href="dashboard.html">RiskSys</a></div>
</nav>
<div class="container">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-danger border-top border-4">
            <div class="card-header bg-white"><h4 class="text-danger">Add Risk</h4></div>
            <div class="card-body">
                <form method="post" action="risks.html">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Asset *</label>
                        <select name="asset_id" class="form-select" required>
                            <option value="">Select Asset...</option>
                            <!-- PYTHON: {% for a in assets %} selected if request.args.asset_id == a.id {% endfor %} -->
                            <option value="1" selected>Production Server A</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Risk Description *</label>
                        <textarea name="risk_description" class="form-control" required></textarea>
                    </div>
                    <div class="mb-3">
                        <!-- PYTHON:
                         GET: assets, risk_categories, treatment_options, annex_controls, risk_statuses
                         POST: validate risk_category_id
                         -->
                        <label class="form-label fw-bold">Risk Category *</label>
                        <select name="risk_category_id" class="form-select" required>
                            <option value="">Select Category...</option>
                            <option value="1">Cybersecurity</option>
                            <option value="2">Operational</option>
                            <option value="3">Safety</option>
                            <option value="4">Compliance</option>
                            <option value="5">Physical Security</option>
                            <option value="6">Environmental</option>
                        </select>
                    </div>
                    <div class="row bg-light rounded p-3 mb-4 mx-0 border">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Likelihood *</label>
                            <select name="likelihood" id="likelihood" class="form-select" required>
                                <option value="1">1</option><option value="2">2</option>
                                <option value="3" selected>3</option><option value="4">4</option><option value="5">5</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Impact *</label>
                            <select name="impact" id="impact" class="form-select" required>
                                <option value="5" selected>5</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Risk Rating</label>
                            <!-- PYTHON: Server recalculates on save; JS updates display only -->
                            <input type="text" id="risk_rating_display" class="form-control fw-bold text-danger" readonly value="High (15)">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Status</label>
                            <select name="risk_status_id" class="form-select">
                                <!-- PYTHON: loop risk_statuses, default Open -->
                                <option value="1">Open</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Treatment *</label>
                            <select name="treatment_option_id" class="form-select" required>
                                <option value="1">Mitigate</option>
                            </select>
                        </div>
                    
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Risk Owner *</label>
                            <input name="risk_owner" class="form-control" required placeholder="e.g. OT Security">
                        </div>
                    
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Review Date</label>
                            <input type="date" name="review_date" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Annex Controls</label>
                        <select name="control_ids" class="form-select" multiple>
                            <!-- PYTHON: name="control_ids" multiple — request.form.getlist("control_ids") -->
                            <option value="1">A.5.1 Policies for information security</option>
                        </select>
                    </div>
                    <div class="text-end">
                        <a href="risks.html" class="btn btn-light border">Cancel</a>
                        <button class="btn btn-danger">Save Risk</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
<!-- PYTHON: Same JS can live in static/app.js or template block -->
<script>
(function () {
    const likelihood = document.getElementById('likelihood');
    const impact = document.getElementById('impact');
    const ratingDisplay = document.getElementById('risk_rating_display');
    function updateRating() {
        ratingDisplay.value = String(parseInt(likelihood.value, 10) * parseInt(impact.value, 10));
    }
    likelihood.addEventListener('change', updateRating);
    impact.addEventListener('change', updateRating);
    updateRating();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
