<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mitigation - RiskSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
    <!-- PYTHON: @admin_required
         GET /mitigations/<id>/edit — load mitigation by id or 404
         POST: UPDATE mitigations; audit_log UPDATE; redirect mitigations list -->
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid"><a class="navbar-brand" href="dashboard.html">RiskSys</a></div>
</nav>
<div class="container">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-success border-top border-4">
            <div class="card-header bg-white">
                <h4 class="text-success">Edit Mitigation Action</h4>
                <p class="text-muted mb-0 small">MIT-1</p>
            </div>
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="mitigation_id" value="1">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Risk *</label>
                        <select name="risk_id" class="form-select" required>
                            <option value="101" selected>RSK-101: Unauthorized access</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Action Description *</label>
                        <textarea name="action_description" class="form-control" required>Install network segmentation</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Assigned To *</label>
                            <select name="assigned_to" class="form-select" required>
                                <option value="2" selected>John Doe</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Target Date</label>
                            <input name="target_date" type="date" class="form-control" value="2026-05-15">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Progress Status</label>
                        <select name="mitigation_status_id" class="form-select">
                            <option value="2" selected>In Progress</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Comments</label>
                        <textarea name="comments" class="form-control">Scheduled for Q2 maintenance window.</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Effectiveness Review Date</label>
                        <input name="effectiveness_review_date" type="date" class="form-control" value="2026-07-01">
                    </div>
                    <div class="text-end">
                        <a href="mitigations.html" class="btn btn-light border">Cancel</a>
                        <button class="btn btn-success">Update Mitigation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
