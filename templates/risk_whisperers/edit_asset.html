<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Asset - RiskSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/style.css">
    <!-- PYTHON: @admin_required
         GET /assets/<id>/edit — load asset + lookup tables
         POST: UPDATE assets SET ... WHERE asset_id=; audit_log UPDATE; redirect assets -->
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="dashboard.html">RiskSys</a>
    </div>
</nav>
<div class="container">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h4>Edit Asset</h4></div>
            <div class="card-body">
                <form method="post" action="assets.html">
                    <!-- PYTHON: hidden asset_id; csrf_token -->
                    <input type="hidden" name="asset_id" value="1">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Asset Name *</label>
                        <!-- PYTHON: value="{{ asset.asset_name }}" -->
                        <input name="asset_name" class="form-control" required value="Production Server A">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="asset_description" class="form-control">Main SCADA host.</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Category *</label>
                            <select name="category_id" class="form-select" required>
                                <!-- PYTHON: options with selected matching asset.category_id -->
                                <option value="1" selected>IT</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Operational Status *</label>
                            <select name="operational_status_id" class="form-select" required>
                                <option value="1" selected>Active</option>
                            </select>
                        </div>
                    </div>
                    <div class="row bg-light rounded p-3 mb-4 mx-0 border">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Classification</label>
                            <select name="classification_id" class="form-select">
                                <option value="">Select...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">CIA Triad Impact Rating</label>
                            <div class="d-flex gap-2">
                                <select name="confidentiality_impact" class="form-select form-select-sm">
                                    <option>Low</option><option selected>High</option>
                                </select>
                                <select name="integrity_impact" class="form-select form-select-sm">
                                    <option selected>Medium</option>
                                </select>
                                <select name="availability_impact" class="form-select form-select-sm">
                                    <option selected>High</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Owner *</label>
                            <input name="asset_owner" class="form-control" required value="Jane Smith">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Location</label>
                            <input name="asset_location" class="form-control" value="Plant Floor 1">
                        </div>
                    </div>
                    <div class="text-end">
                        <a href="view_asset.html" class="btn btn-light border">Cancel</a>
                        <button class="btn btn-primary">Update Asset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
