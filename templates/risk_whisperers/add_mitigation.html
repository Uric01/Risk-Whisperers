<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Mitigation - RiskSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="static/style.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-shield-check me-2 text-info"></i>RiskSys</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="assets.html">Assets</a></li>
                    <li class="nav-item"><a class="nav-link" href="risks.html">Risks</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">Mitigations</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="mitigations.html"><i class="bi bi-pencil-square me-2"></i>Edit</a></li>
                            <!-- PYTHON: {% if session.role == "Admin" %} -->
                            <li><a class="dropdown-item" href="add_mitigation.html"><i class="bi bi-plus-circle me-2"></i>Add</a></li>
                            <!-- PYTHON: {% endif %} -->
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                    <!-- PYTHON: {% if session.role == "Admin" %} -->
                    <li class="nav-item"><a class="nav-link" href="audit_logs.html">Audit Logs</a></li>
                    <li class="nav-item"><a class="nav-link" href="user_management.html">User Management</a></li>
                    <!-- PYTHON: {% endif %} -->
                </ul>
                <div class="d-flex align-items-center">
                    <!-- PYTHON: {{ session.full_name }} -->
                    <span class="text-light me-3"><i class="bi bi-person-circle me-1"></i>Admin User</span>
                    <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>
<div class="container mt-4">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-success border-top border-4">
            <div class="card-header bg-white"><h4 class="text-success">Add Mitigation Action</h4></div>
            <div class="card-body">
                <form method="post" action="mitigations.html">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Risk *</label>
                        <select name="risk_id" class="form-select" required>
                            <!-- PYTHON: {% for r in risks %} selected if request.args.risk_id == r.id {% endfor %} -->
                            <option value="101" selected>RSK-101: Unauthorized access to control network</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Action Description *</label>
                        <textarea name="action_description" class="form-control" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Assigned To *</label>
                            <select name="assigned_to" class="form-select" required>
                                <!-- PYTHON: {% for u in users %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %} -->
                                <option value="2">John Doe</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Target Date</label>
                            <input name="target_date" type="date" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Progress Status</label>
                        <select name="mitigation_status_id" class="form-select">
                            <!-- PYTHON: Not Started, In Progress, Completed from DB -->
                            <option value="1">Not Started</option>
                            <option value="2">In Progress</option>
                            <option value="3">Completed</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Comments</label>
                        <textarea name="comments" class="form-control"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Effectiveness Review Date</label>
                        <input name="effectiveness_review_date" type="date" class="form-control">
                    </div>
                    <div class="text-end">
                        <a href="mitigations.html" class="btn btn-light border">Cancel</a>
                        <button class="btn btn-success">Save Mitigation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
