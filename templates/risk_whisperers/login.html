<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RiskSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="static/style.css">
     
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check text-primary" style="font-size:3rem;"></i>
            <h3 class="mt-2 fw-bold">Risk Management Portal</h3>
            <p class="text-muted mb-1">Web-Based Asset Risk Management System</p>
            <p class="text-muted small">Enter your credentials to access</p>
        </div>

       

        <div class="alert alert-danger d-none" id="demo-error">
           
            Invalid username or password.
        </div>

       
        <form method="post" action="dashboard.html">
            <div class="mb-3">
                <label class="form-label">Username</label>
                 
                <input name="username" class="form-control form-control-lg" placeholder="admin">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control form-control-lg">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
        </form>
    </div>
</div>
</body>
</html>
