<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RiskSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/style.css">
    <!-- PYTHON: @app.route("/login", methods=["GET", "POST"])
         GET: render login.html
         POST: read request.form["username"], request.form["password"]
         - if empty: flash error "Please enter username and password"
         - query User joined with Role by username (SQLAlchemy/psycopg2)
         - verify password with werkzeug.security.check_password_hash
         - on success: session["user_id"], session["full_name"], session["role"]; audit_log LOGIN; redirect dashboard
         - on failure: flash "Invalid username or password"
         If session already logged in: redirect dashboard -->
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check text-primary" style="font-size:3rem;"></i>
            <h3 class="mt-2 fw-bold">Risk Management Portal</h3>
            <p class="text-muted mb-1">Web-Based Asset Risk Management System</p>
            <p class="text-muted small">Enter your credentials to access</p>
        </div>

        <!-- PYTHON: {% with messages = get_flashed_messages(with_categories=true) %}
             {% for category, message in messages %}
             <div class="alert alert-{{ category }}">{{ message }}</div>
             {% endfor %}{% endwith %}
             Show danger alert when error variable is set -->

        <div class="alert alert-danger d-none" id="demo-error">
            <!-- PYTHON: Example error placeholder — remove in production template -->
            Invalid username or password.
        </div>

        <!-- PYTHON: form action=url_for("login") method="POST"
             Add CSRF: {{ csrf_token() }} (Flask-WTF) or {% csrf_token %} (Django) -->
        <form method="post" action="dashboard.html">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <!-- PYTHON: value="{{ request.form.username or '' }}" to repopulate on error -->
                <input name="username" class="form-control form-control-lg" placeholder="admin">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control form-control-lg">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
        </form>
    </div>
</div>
</body>
</html>
