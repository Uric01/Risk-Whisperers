name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: [javascript, python]
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [node, python]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      if: matrix.language == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Node dependencies
      if: matrix.language == 'node'
      run: npm install
    - name: Run ESLint
      if: matrix.language == 'node'
      run: npm run lint
    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Django tests
      if: matrix.language == 'python' && exists('manage.py')
      run: python manage.py test

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: risk-whisperers:latest
        load: true
    - name: Run Bandit SAST scan
      run: |
        python -m pip install --upgrade pip
        python -m pip install bandit
        bandit -r . -f sarif -o bandit-results.sarif || true
    - name: Upload Bandit SARIF results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'bandit-results.sarif'
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        scan-ref: 'risk-whisperers:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    - name: Run Snyk Python SCA
      uses: snyk/actions/setup@v3
      with:
        version: 'latest'
    - name: Run Snyk test for Python
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        if [ -f requirements.txt ]; then snyk test --file=requirements.txt --package-manager=pip; else echo 'No requirements.txt found'; fi
    - name: Run Snyk test for Node
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        if [ -f package.json ]; then snyk test --file=package.json --package-manager=npm; else echo 'No package.json found'; fi

  deploy:
    needs: [security-scan, lint-and-test, build-and-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/risk-whisperers:latest