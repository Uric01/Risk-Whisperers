name: Django DevSecOps Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  ci-security-test:
    runs-on: ubuntu-latest

    steps:

    # -------------------------
    # 1. Checkout code
    # -------------------------
    - name: Checkout code
      uses: actions/checkout@v4


    # -------------------------
    # 2. Setup Python + dependencies
    # -------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit pip-audit pytest


    # -------------------------
    # 3. Linting (flake8)
    # -------------------------
    - name: Run flake8 (linting)
      run: flake8 .


    # -------------------------
    # 4. Bandit (SAST security scan)
    # -------------------------
    - name: Run Bandit security scan
      run: bandit -r . -ll


    # -------------------------
    # 5. pip-audit (dependency scan)
    # -------------------------
    - name: Run pip-audit
      run: pip-audit


    # -------------------------
    # 6. Snyk (deep SCA)
    # -------------------------
    - name: Install Snyk CLI
      run: npm install -g snyk

    - name: Authenticate Snyk
      run: snyk auth ${{ secrets.SNYK_TOKEN }}

    - name: Run Snyk test
      run: snyk test --severity-threshold=high


    # -------------------------
    # 7. Run tests (pytest)
    # -------------------------
    - name: Run pytest
      run: pytest -v


    # -------------------------
    # 8. Build Docker image (optional)
    # -------------------------
    - name: Build Docker image
      run: |
        docker build -t risk-management-app:latest .


  # -------------------------
  # 9. Deploy (only main branch)
  # -------------------------
  deploy:
    needs: ci-security-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /var/www/risk_management
          git pull origin main
          docker-compose down
          docker-compose up -d --build